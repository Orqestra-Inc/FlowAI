# Keeps the free Render instance awake during hackathon judging (17–21 Oct 2026).
# Render's free tier sleeps after 15 minutes without traffic; a ping every 10 minutes prevents that.
# GitHub may delay scheduled runs by several minutes under load, so a second monitor (e.g. UptimeRobot) is a good backup.
name: Keep demo warm

on:
  schedule:
    - cron: '*/10 * * * *'
  workflow_dispatch: {}

permissions: {}

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Ping /api/health (until judging ends)
        env:
          URL: https://orqestra.onrender.com/api/health
          UNTIL: '2026-10-22T00:00:00+03:00'
        run: |
          if [ "$(date -u +%s)" -ge "$(date -u -d "$UNTIL" +%s)" ]; then
            echo "Judging period is over; not pinging. Delete this workflow when convenient."
            exit 0
          fi
          # A sleeping instance takes ~1 minute to wake, so allow a long first attempt and retry.
          for i in 1 2 3; do
            code=$(curl -s -o /dev/null -w '%{http_code}' --max-time 90 "$URL" || true)
            echo "Attempt $i: HTTP $code"
            [ "$code" = "200" ] && exit 0
            sleep 15
          done
          echo "::warning::Demo did not answer 200 after 3 attempts"
          exit 1
