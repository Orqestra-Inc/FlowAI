# Keeps the free Render instance awake during hackathon judging (17–21 Oct 2026).
# Render's free tier sleeps after 15 minutes without traffic.
#
# GitHub runs scheduled jobs at most every 5 minutes and can start them late under load,
# so each run also keeps pinging for ~12 minutes. Runs overlap, which means a late or skipped
# run still leaves no 15-minute gap. Public repos get Actions minutes free.
name: Keep demo warm

on:
  schedule:
    - cron: '3-59/5 * * * *'   # every 5 min, off the busy top-of-hour slot
  workflow_dispatch: {}

permissions: {}

concurrency:
  group: keep-warm
  cancel-in-progress: true      # a newer run takes over; it pings immediately

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 16
    steps:
      - name: Ping /api/health every 4 minutes for ~12 minutes (until judging ends)
        env:
          URL: https://orqestra.onrender.com/api/health
          UNTIL: '2026-10-22T00:00:00+03:00'
        run: |
          if [ "$(date -u +%s)" -ge "$(date -u -d "$UNTIL" +%s)" ]; then
            echo "Judging period is over; not pinging. Delete this workflow when convenient."
            exit 0
          fi
          ok=0
          for round in 1 2 3 4; do
            # A sleeping instance takes about a minute to wake, so allow a long request.
            code=$(curl -s -o /dev/null -w '%{http_code}' --max-time 90 "$URL" || true)
            echo "$(date -u +%H:%M:%S) ping $round: HTTP $code"
            [ "$code" = "200" ] && ok=1
            [ "$round" -lt 4 ] && sleep 240
          done
          [ "$ok" = "1" ] || { echo "::warning::Demo never answered 200 in this run"; exit 1; }
